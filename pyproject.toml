[project]
name = "persforest"
version = "0.2.0"
description = "Persistence forests, cycle progression barcodes and measurement landscapes for codimension-one persistent homology."
authors = [
    {name = "Leon Renkin",email = "leon.renkin@gmail.com"},
    {name = "Fabian Lenzen"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "gudhi>=3.11",
]

[project.urls]
Repository = "https://github.com/leonrenkin/persforest"
Issues = "https://github.com/leonrenkin/persforest/issues"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
plotly = [
    "persforest[plot]",
    "plotly>=6.0",
]
notebook = [
    "persforest[plotly]",
    "nbformat>=5.10",
    "ipywidgets>=8.1",
    "anywidget>=0.9",
]
examples = [
    "persforest[plot]",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]
droplets = [
    "persforest[plot]",
    "scipy>=1.11",
    "pillow>=10.0",
    "pandas>=2.2",
    "ipywidgets>=8.1",
]

[build-system]
# Build-time only: the compiled construction engine (cpp/) and its bindings.
requires = ["scikit-build-core>=1.1.2,<2", "nanobind>=3.1,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/persforest"]
# The sdist holds the package, the engine sources and the build files only.
sdist.exclude = ["*"]
sdist.include = ["/src/persforest/**/*.py", "/cpp/*.cpp", "/cpp/*.hpp", "/CMakeLists.txt",
                 "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.uv]
# Rebuild the editable install when the compiled engine or its build changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "cpp/**/*" }]
