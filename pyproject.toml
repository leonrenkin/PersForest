[project]
name = "persforest"
version = "0.1.0"
description = "Persistence forests, cycle progressions, and measurement landscapes"
authors = [
    {name = "Leon Renkin",email = "leon.renkin@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "gudhi>=3.11",
]

[project.urls]
Repository = "https://github.com/leonrenkin/persforest"
Issues = "https://github.com/leonrenkin/persforest/issues"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
]
plotly = [
    "persforest[plot]",
    "plotly>=6.0",
]
notebook = [
    "persforest[plotly]",
    "nbformat>=5.10",
    "ipywidgets>=8.1",
    "anywidget>=0.9",
]
examples = [
    "persforest[plot]",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]
animation = [
    "persforest[plot]",
    "pillow>=10.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["**/.DS_Store"]
